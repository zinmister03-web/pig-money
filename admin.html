<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小豬沒錢日記 - 管理</title>
<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f6f3ef;
  color: #3d3028;
}

.wrap {
  max-width: 1080px;
  margin: auto;
  padding: 15px;
}

.hero {
  background: #fff;
  border-radius: 16px;
  padding: 15px;
  margin-bottom: 15px;
}

.hero-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
}

.hero-btns {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}

button {
  padding: 10px 14px;
  border: none;
  border-radius: 10px;
  cursor: pointer;
  font-weight: bold;
}

.btn-main { background: #ff7aa2; color: white; }
.btn-del { background: #ff4d4d; color: white; }
.btn-edit { background: #ffc94d; color: #4a3600; }
.btn-save { background: #47b36b; color: white; }
.btn-cancel { background: #ddd; color: #333; }
.btn-gray { background: #bfbfbf; color: white; }

.hidden { display: none; }

input, select, textarea {
  padding: 10px;
  border-radius: 10px;
  border: 1px solid #ccc;
  width: 100%;
  font-size: 15px;
  box-sizing: border-box;
}

.form {
  display: grid;
  grid-template-columns: 1.2fr 0.8fr 0.8fr 1fr 0.9fr auto;
  gap: 10px;
  margin-top: 12px;
  align-items: center;
}

.card {
  background: #fff;
  border-radius: 16px;
  padding: 15px;
  margin-top: 15px;
}

.section-block + .section-block {
  margin-top: 22px;
}

.section-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  margin-bottom: 10px;
}

.section-title {
  font-size: 18px;
  font-weight: bold;
}

.section-sub {
  color: #666;
  font-size: 14px;
}

.item {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  padding: 14px 10px;
  border-bottom: 1px solid #eee;
  gap: 12px;
  transition: 0.2s;
}

.item-left {
  min-width: 0;
  flex: 1;
}

.item-name {
  font-weight: bold;
  word-break: break-word;
  font-size: 16px;
}

.item-sub {
  font-size: 13px;
  color: #666;
  margin-top: 6px;
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

.item-right {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  justify-content: flex-end;
}

.sync-status {
  margin-top: 10px;
  font-size: 14px;
  color: #666;
}

.badge {
  display: inline-block;
  font-size: 12px;
  padding: 4px 10px;
  border-radius: 999px;
  background: #ffe8ef;
  color: #8b4d61;
}

.paid-tag {
  background: #dff7e7;
  color: #1f7a3d;
}

.unpaid-tag {
  background: #fff1d9;
  color: #9a6a00;
}

.pending-tag {
  background: #e6f0ff;
  color: #2d5ea8;
}

.deleted-item {
  opacity: 0.45;
  background: #f1f1f1;
}

.deleted-item .item-name {
  text-decoration: line-through;
}

.check-row {
  display: flex;
  align-items: center;
  gap: 6px;
  white-space: nowrap;
}

.check-row input[type="checkbox"] {
  width: auto;
  transform: scale(1.2);
}

.summary-box {
  display: flex;
  gap: 16px;
  flex-wrap: wrap;
  margin-top: 10px;
  font-size: 15px;
}

.summary-box strong {
  color: #333;
}

.inline-edit {
  display: grid;
  grid-template-columns: 1.1fr 0.8fr 0.8fr 1fr 0.9fr auto auto;
  gap: 8px;
  width: 100%;
  align-items: center;
}

.note-box {
  color: #555;
}

.empty-box {
  color: #777;
  background: #faf7f3;
  border: 1px dashed #e3d7cc;
  padding: 16px;
  border-radius: 12px;
  text-align: center;
}

.log-box {
  max-height: 360px;
  overflow: auto;
  border: 1px solid #eee;
  border-radius: 12px;
  padding: 10px;
  background: #fffafc;
}

.log-item {
  padding: 10px 8px;
  border-bottom: 1px solid #eee;
  font-size: 14px;
  line-height: 1.5;
}

.log-item:last-child {
  border-bottom: none;
}

.log-time {
  color: #888;
  font-size: 12px;
}

.log-action {
  font-weight: bold;
  margin-right: 8px;
}

.sync-overlay {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 9999;
  display: none;
}

.sync-overlay.show {
  display: block;
}

.run-track {
  position: fixed;
  left: 20px;
  right: 20px;
  bottom: 30px;
  height: 80px;
  background: rgba(255,255,255,0.9);
  border: 1px solid #f3cfd9;
  border-radius: 999px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.12);
  overflow: hidden;
}

.run-line {
  position: absolute;
  left: 18px;
  right: 18px;
  bottom: 18px;
  border-top: 3px dashed #f1a8bc;
}

.runner {
  position: absolute;
  left: -60px;
  bottom: 18px;
  font-size: 42px;
  animation: pigRunAcross 2.2s linear infinite;
}

.runner-text {
  position: absolute;
  top: 12px;
  left: 20px;
  font-size: 14px;
  color: #666;
  font-weight: bold;
}

@keyframes pigRunAcross {
  0%   { left: -60px; transform: translateY(0); }
  10%  { transform: translateY(-4px); }
  20%  { transform: translateY(0); }
  30%  { transform: translateY(-4px); }
  40%  { transform: translateY(0); }
  50%  { transform: translateY(-4px); }
  60%  { transform: translateY(0); }
  70%  { transform: translateY(-4px); }
  80%  { transform: translateY(0); }
  100% { left: calc(100% - 30px); transform: translateY(0); }
}

.success-pop {
  position: fixed;
  left: 50%;
  bottom: 120px;
  transform: translateX(-50%);
  background: rgba(255,255,255,0.96);
  border: 1px solid #f3cfd9;
  border-radius: 24px;
  padding: 14px 20px;
  box-shadow: 0 12px 30px rgba(0,0,0,0.14);
  display: none;
  z-index: 10000;
  text-align: center;
  min-width: 200px;
}

.success-pop.show {
  display: block;
  animation: popIn 0.35s ease;
}

.success-title {
  font-weight: bold;
  color: #ff5f92;
  margin-bottom: 6px;
}

.hearts {
  font-size: 24px;
  letter-spacing: 6px;
  animation: heartBeat 0.8s ease-in-out infinite alternate;
}

@keyframes popIn {
  from {
    opacity: 0;
    transform: translateX(-50%) translateY(20px) scale(0.9);
  }
  to {
    opacity: 1;
    transform: translateX(-50%) translateY(0) scale(1);
  }
}

@keyframes heartBeat {
  from { transform: scale(1); }
  to   { transform: scale(1.15); }
}

@media (max-width: 900px){
  .form,
  .inline-edit {
    grid-template-columns: 1fr;
  }

  .item {
    flex-direction: column;
    align-items: stretch;
  }

  .item-right {
    width: 100%;
    justify-content: flex-start;
  }

  .run-track {
    left: 12px;
    right: 12px;
    bottom: 18px;
    height: 74px;
  }

  .runner {
    font-size: 36px;
  }

  .success-pop {
    width: calc(100% - 32px);
    min-width: auto;
  }
}
</style>
</head>

<body>

<div class="wrap">
  <div class="hero">
    <div class="hero-top">
      <h2>🐷 管理頁</h2>
      <div class="hero-btns">
        <button class="btn-main" onclick="syncAll()">同步全部</button>
        <button class="btn-gray" onclick="discardAll()">取消本次變更</button>
        <button onclick="toggle()">收起</button>
      </div>
    </div>

    <div id="top">
      <div class="summary-box">
        <div>總筆數：<strong id="count">0</strong></div>
        <div>總額：<strong>$<span id="total">0</span></strong></div>
        <div>已付：<strong>$<span id="paidTotal">0</span></strong></div>
        <div>未付：<strong>$<span id="unpaidTotal">0</span></strong></div>
        <div>待同步變更：<strong id="pendingCount">0</strong></div>
      </div>

      <div class="sync-status" id="syncStatus">目前狀態：已完成</div>

      <div class="form">
        <input id="name" placeholder="名稱">
        <input id="money" type="number" placeholder="金額">
        <select id="type">
          <option>商品</option>
          <option>匯款</option>
          <option>其他</option>
        </select>
        <input id="dateInput" type="date">
        <label class="check-row">
          <input id="paidInput" type="checkbox">
          已付
        </label>
        <button class="btn-main" onclick="add()">新增</button>
      </div>

      <div class="form" style="grid-template-columns: 1fr;">
        <input id="noteInput" placeholder="備註（可空白）">
      </div>
    </div>
  </div>

  <div class="card">
    <div id="list"></div>
  </div>

  <div class="card">
    <div class="section-head">
      <div class="section-title">本次變更記錄</div>
      <div class="section-sub">只有按「同步全部」才會真的送出</div>
    </div>
    <div id="logBox" class="log-box"></div>
  </div>
</div>

<div id="syncOverlay" class="sync-overlay">
  <div class="run-track">
    <div class="runner-text" id="runnerText">小豬同步中...</div>
    <div class="run-line"></div>
    <div class="runner">🐷</div>
  </div>
</div>

<div id="successPop" class="success-pop">
  <div class="success-title">成功同步</div>
  <div class="hearts">🩵 💗 🩵</div>
</div>

<script>
const API = "https://script.google.com/macros/s/AKfycbwahAiG7COCHfCOITf1XoIWKdL-pWHLvYlmMxPEDrlndD8r3pxTQupZQKboOklVCfA3jQ/exec";
const PASSWORD = "12345678";

let data = [];
let originalData = [];
let changeLogs = [];
let successTimer = null;
let dirty = false;
let editingId = null;
let isSaving = false;

function toggle() {
  document.getElementById("top").classList.toggle("hidden");
}

function nowStr() {
  const d = new Date();
  const pad = n => String(n).padStart(2, "0");
  return `${d.getFullYear()}/${pad(d.getMonth()+1)}/${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
}

function cloneDeep(obj) {
  return JSON.parse(JSON.stringify(obj));
}

function normalizePaid(value) {
  if (value === true || value === 1) return true;
  if (value === false || value === 0 || value == null) return false;
  const str = String(value).trim().toLowerCase();
  return ['true', '1', 'yes', 'y', 'on', '已付'].includes(str);
}

function normalizeItem(item) {
  return {
    ...item,
    id: item && item.id != null ? String(item.id) : String(Date.now() + Math.floor(Math.random() * 1000)),
    name: item && item.name ? String(item.name) : "",
    amount: Number(item && item.amount || 0),
    type: item && item.type ? String(item.type) : "其他",
    note: item && item.note ? String(item.note) : "",
    date: item && item.date ? String(item.date) : "",
    paid: normalizePaid(item && item.paid),
    createdAt: Number(item && item.createdAt || Date.now()),
    _deleted: !!(item && item._deleted),
    _isNew: !!(item && item._isNew),
    _modified: !!(item && item._modified)
  };
}

function getVisibleData() {
  return data.filter(d => !d._deleted);
}

function getPendingCount() {
  return changeLogs.length;
}

function addLog(action, text) {
  changeLogs.unshift({
    time: nowStr(),
    action,
    text
  });
  renderLogs();
  updateStatus();
}

function clearLogs() {
  changeLogs = [];
  renderLogs();
  updateStatus();
}

function renderLogs() {
  const box = document.getElementById("logBox");
  if (!changeLogs.length) {
    box.innerHTML = `<div class="empty-box">目前沒有待同步的變更</div>`;
    return;
  }

  box.innerHTML = changeLogs.map(log => `
    <div class="log-item">
      <div><span class="log-action">${escapeHtml(log.action)}</span>${escapeHtml(log.text)}</div>
      <div class="log-time">${escapeHtml(log.time)}</div>
    </div>
  `).join("");
}

function toggleDirty(flag = true) {
  dirty = flag;
  updateStatus();
}

function updateStatus() {
  document.getElementById("syncStatus").innerText = dirty
    ? `目前狀態：有未同步變更（${getPendingCount()} 筆）`
    : "目前狀態：已同步完成";
  document.getElementById("pendingCount").innerText = getPendingCount();
}

function showSync(text = "小豬同步中...") {
  hideSuccess();
  document.getElementById("syncOverlay").classList.add("show");
  document.getElementById("runnerText").innerText = text;
  document.getElementById("syncStatus").innerText = "目前狀態：同步中...";
}

function hideSync(statusText = "目前狀態：已完成") {
  document.getElementById("syncOverlay").classList.remove("show");
  document.getElementById("syncStatus").innerText = statusText;
}

function showSuccess() {
  clearTimeout(successTimer);
  const pop = document.getElementById("successPop");
  pop.classList.add("show");
  successTimer = setTimeout(() => {
    hideSuccess();
  }, 1800);
}

function hideSuccess() {
  document.getElementById("successPop").classList.remove("show");
}

async function load() {
  try {
    showSync("小豬正在把資料叼回來...");
    const res = await fetch(API + "?action=get");
    const json = await res.json();

    data = (json.items || []).map(normalizeItem);
    originalData = cloneDeep(data);
    dirty = false;
    editingId = null;
    clearLogs();
    render();
    hideSync("目前狀態：已同步完成");
    showSuccess();
  } catch (err) {
    hideSync("目前狀態：同步失敗");
    alert("讀取失敗：" + err.message);
  }
}

function render() {
  const list = document.getElementById("list");
  list.innerHTML = "";

  let total = 0;
  let paidTotal = 0;
  let unpaidTotal = 0;

  const visibleData = getVisibleData();
  const unpaidData = visibleData.filter(d => !d.paid);
  const paidData = visibleData.filter(d => d.paid);

  visibleData.forEach(d => {
    const amount = Number(d.amount || 0);
    total += amount;
    if (d.paid) paidTotal += amount;
    else unpaidTotal += amount;
  });

  list.innerHTML = `
    ${renderSection("未付", unpaidData, false)}
    ${renderSection("已付", paidData, true)}
    ${renderDeletedSection()}
  `;

  document.getElementById("count").innerText = visibleData.length;
  document.getElementById("total").innerText = total.toLocaleString();
  document.getElementById("paidTotal").innerText = paidTotal.toLocaleString();
  document.getElementById("unpaidTotal").innerText = unpaidTotal.toLocaleString();
  updateStatus();
}

function renderSection(title, arr, isPaid) {
  const subtotal = arr.reduce((acc, d) => acc + Number(d.amount || 0), 0);
  return `
    <div class="section-block">
      <div class="section-head">
        <div class="section-title">${title}</div>
        <div class="section-sub">${arr.length} 筆｜小計 $${subtotal.toLocaleString()}</div>
      </div>
      ${
        arr.length
          ? arr.map(d => renderItem(d, isPaid)).join("")
          : `<div class="empty-box">${title}區目前沒有項目</div>`
      }
    </div>
  `;
}

function renderDeletedSection() {
  const deleted = data.filter(d => d._deleted);
  if (!deleted.length) return "";

  return `
    <div class="section-block">
      <div class="section-head">
        <div class="section-title">待刪除</div>
        <div class="section-sub">${deleted.length} 筆｜同步後才真的刪除</div>
      </div>
      ${deleted.map(d => renderDeletedItem(d)).join("")}
    </div>
  `;
}

function renderDeletedItem(d) {
  const safeId = JSON.stringify(String(d.id));
  return `
    <div class="item deleted-item">
      <div class="item-left">
        <div class="item-name">
          ${escapeHtml(d.name || "")}
          <span class="badge">${escapeHtml(d.type || "")}</span>
          <span class="badge pending-tag">待刪除</span>
        </div>
        <div class="item-sub">
          <span>金額：$${Number(d.amount || 0).toLocaleString()}</span>
          ${d.date ? `<span>日期：${escapeHtml(d.date)}</span>` : `<span>日期：—</span>`}
          ${d.note ? `<span class="note-box">備註：${escapeHtml(d.note)}</span>` : ``}
        </div>
      </div>

      <div class="item-right">
        <button class="btn-cancel" onclick='undoDelete(${safeId})'>取消刪除</button>
      </div>
    </div>
  `;
}

function renderItem(d, isPaid) {
  const safeId = JSON.stringify(String(d.id));

  if (String(editingId) === String(d.id)) {
    return `
      <div class="item">
        <div style="width:100%;">
          <div class="inline-edit">
            <input id="edit-name-${d.id}" value="${escapeAttr(d.name)}" placeholder="名稱">
            <input id="edit-money-${d.id}" type="number" value="${Number(d.amount || 0)}" placeholder="金額">
            <select id="edit-type-${d.id}">
              <option ${d.type === '商品' ? 'selected' : ''}>商品</option>
              <option ${d.type === '匯款' ? 'selected' : ''}>匯款</option>
              <option ${d.type === '其他' ? 'selected' : ''}>其他</option>
            </select>
            <input id="edit-date-${d.id}" type="date" value="${escapeAttr(d.date || '')}">
            <label class="check-row">
              <input id="edit-paid-${d.id}" type="checkbox" ${d.paid ? 'checked' : ''}>
              已付
            </label>
            <button class="btn-save" onclick='saveEdit(${safeId})'>套用</button>
            <button class="btn-cancel" onclick="cancelEdit()">取消</button>
          </div>
          <div style="margin-top:10px;">
            <input id="edit-note-${d.id}" value="${escapeAttr(d.note || '')}" placeholder="備註（可空白）">
          </div>
        </div>
      </div>
    `;
  }

  return `
    <div class="item">
      <div class="item-left">
        <div class="item-name">
          ${escapeHtml(d.name || "")}
          <span class="badge">${escapeHtml(d.type || "")}</span>
          <span class="badge ${isPaid ? 'paid-tag' : 'unpaid-tag'}">${isPaid ? '已付' : '未付'}</span>
          ${d._isNew ? `<span class="badge pending-tag">新增待同步</span>` : ``}
          ${d._modified ? `<span class="badge pending-tag">修改待同步</span>` : ``}
        </div>
        <div class="item-sub">
          <span>金額：$${Number(d.amount || 0).toLocaleString()}</span>
          ${d.date ? `<span>日期：${escapeHtml(d.date)}</span>` : `<span>日期：—</span>`}
          ${d.note ? `<span class="note-box">備註：${escapeHtml(d.note)}</span>` : ``}
        </div>
      </div>

      <div class="item-right">
        <label class="check-row">
          <input type="checkbox" ${d.paid ? "checked" : ""} onchange='togglePaidById(${safeId}, this.checked)'>
          已付
        </label>
        <button class="btn-edit" onclick='startEdit(${safeId})'>編輯</button>
        <button class="btn-del" onclick='markDelete(${safeId})'>刪除</button>
      </div>
    </div>
  `;
}

function add() {
  const name = document.getElementById("name").value.trim();
  const money = Number(document.getElementById("money").value);
  const type = document.getElementById("type").value;
  const date = document.getElementById("dateInput").value;
  const note = document.getElementById("noteInput").value.trim();
  const paid = document.getElementById("paidInput").checked;

  if (!name) return alert("請填名稱");
  if (Number.isNaN(money)) return alert("請填金額");

  const newItem = normalizeItem({
    id: String(Date.now() + Math.floor(Math.random() * 1000)),
    name,
    amount: money,
    type,
    date,
    note,
    paid,
    createdAt: Date.now(),
    _isNew: true
  });

  data.unshift(newItem);
  toggleDirty(true);
  addLog("新增", `新增「${name}」$${Number(money).toLocaleString()}`);
  render();

  document.getElementById("name").value = "";
  document.getElementById("money").value = "";
  document.getElementById("type").value = "商品";
  document.getElementById("dateInput").value = "";
  document.getElementById("noteInput").value = "";
  document.getElementById("paidInput").checked = false;
}

function markDelete(id) {
  const target = data.find(d => String(d.id) === String(id));
  if (!target) return;

  target._deleted = true;
  target._modified = true;
  if (String(editingId) === String(id)) editingId = null;

  toggleDirty(true);
  addLog("刪除", `標記刪除「${target.name}」`);
  render();
}

function undoDelete(id) {
  const target = data.find(d => String(d.id) === String(id));
  if (!target) return;

  target._deleted = false;
  toggleDirty(true);
  addLog("取消刪除", `取消刪除「${target.name}」`);
  render();
}

function togglePaidById(id, checked) {
  const target = data.find(d => String(d.id) === String(id));
  if (!target) return;

  target.paid = checked;
  target._modified = true;
  toggleDirty(true);
  addLog("已付狀態", `「${target.name}」改成${checked ? "已付" : "未付"}`);
  render();
}

function startEdit(id) {
  editingId = String(id);
  render();
}

function cancelEdit() {
  editingId = null;
  render();
}

function saveEdit(id) {
  const target = data.find(d => String(d.id) === String(id));
  if (!target) return;

  const name = document.getElementById(`edit-name-${id}`).value.trim();
  const money = Number(document.getElementById(`edit-money-${id}`).value);
  const type = document.getElementById(`edit-type-${id}`).value;
  const date = document.getElementById(`edit-date-${id}`).value;
  const note = document.getElementById(`edit-note-${id}`).value.trim();
  const paid = document.getElementById(`edit-paid-${id}`).checked;

  if (!name) return alert("名稱不能空白");
  if (Number.isNaN(money)) return alert("金額格式錯誤");

  target.name = name;
  target.amount = money;
  target.type = type;
  target.date = date;
  target.note = note;
  target.paid = paid;
  target._modified = true;

  editingId = null;
  toggleDirty(true);
  addLog("編輯", `更新「${name}」`);
  render();
}

function discardAll() {
  if (!dirty) {
    alert("目前沒有未同步變更");
    return;
  }

  if (!confirm("要取消本次所有未同步變更嗎？")) return;

  data = cloneDeep(originalData).map(normalizeItem);
  editingId = null;
  dirty = false;
  clearLogs();
  render();
}

async function syncAll() {
  if (!dirty) {
    alert("目前沒有需要同步的變更");
    return;
  }

  const payload = data
    .filter(d => !d._deleted)
    .map(d => ({
      id: d.id,
      name: d.name,
      amount: d.amount,
      type: d.type,
      date: d.date,
      note: d.note,
      paid: d.paid,
      createdAt: d.createdAt
    }));

  await save(payload);
  await load();
}

async function save(payload) {
  if (isSaving) return;
  isSaving = true;

  try {
    showSync("小豬正在衝去同步...");
    const res = await fetch(API, {
      method: "POST",
      headers: {
        "Content-Type": "text/plain;charset=utf-8"
      },
      body: JSON.stringify({
        action: "save",
        password: PASSWORD,
        items: payload
      })
    });

    const json = await res.json();
    if (!json.ok) {
      throw new Error(json.error || "儲存失敗");
    }

    dirty = false;
    hideSync("目前狀態：儲存完成");
    showSuccess();
  } catch (err) {
    hideSync("目前狀態：儲存失敗");
    alert("儲存失敗：" + err.message);
  } finally {
    isSaving = false;
  }
}

function escapeHtml(str) {
  return String(str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

function escapeAttr(str) {
  return String(str ?? "")
    .replace(/&/g, "&amp;")
    .replace(/"/g, "&quot;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");
}

load();
</script>
